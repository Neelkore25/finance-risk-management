name: Deploy Finance Risk Analytics to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build React Client with Production Variables
        run: |
          cd client
          export VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}"
          if [ -z "$VITE_SUPABASE_URL" ]; then export VITE_SUPABASE_URL="https://pxxqrrnpbpldyslseegy.supabase.co"; fi
          export VITE_SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then export VITE_SUPABASE_ANON_KEY="sb_publishable__T31MM88-paDjC7ejcFWlw_cejGuMls"; fi
          export VITE_ANALYTICS_API_URL="${{ secrets.VITE_ANALYTICS_API_URL }}"
          if [ -z "$VITE_ANALYTICS_API_URL" ]; then export VITE_ANALYTICS_API_URL="https://finance-risk-analytics-python.up.railway.app"; fi
          npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: client/dist
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
